name: deploy

# Builds the WebAssembly portfolio (wasm/) and publishes it to GitHub Pages
# via the Actions pipeline (repo Settings -> Pages -> Source: GitHub Actions).
# The output is fully static - portfolio.{html,js,wasm} - so deployment is a
# plain artifact upload, served as-is (no Jekyll, no .nojekyll needed).
#
# Nothing to install: the runner image provides cmake, ninja and python3, and
# cmake/toolchains/emscripten.cmake bootstraps the pinned emsdk into
# wasm/.emsdk on first configure. Both that SDK and the CPM package sources
# are cached between runs.

on:
  push:
    branches: [main]
  pull_request: # build-only check - deploy stays main-only
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # CPM.cmake honours this: SDL3/imgui/implot/fontawesome sources persist
  # between runs instead of being re-fetched on every configure.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wasm
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: cache emsdk
        uses: actions/cache@v4
        with:
          path: wasm/.emsdk
          # The toolchain file carries the pinned SDK version - any bump
          # changes the hash and re-bootstraps exactly once.
          key: emsdk-${{ hashFiles('wasm/cmake/toolchains/emscripten.cmake') }}

      - name: cache cpm dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('wasm/cmake/**') }}

      - name: configure
        run: cmake --preset emscripten

      - name: build
        run: cmake --build --preset emscripten-release

      # Ninja Multi-Config nests output under build/emscripten/src/Release -
      # locate it instead of hardcoding the path. Pages serves index.html at
      # the site root, so the shell page is renamed on the way out.
      - name: stage pages artifact
        run: |
          out="$(dirname "$(find build/emscripten -name portfolio.html -print -quit)")"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$out"/portfolio.* "$GITHUB_WORKSPACE/dist/"
          mv "$GITHUB_WORKSPACE/dist/portfolio.html" "$GITHUB_WORKSPACE/dist/index.html"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: setup pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v5
