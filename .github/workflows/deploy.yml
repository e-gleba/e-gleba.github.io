name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # weekly data refresh — mon 05:00 utc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        run: npm install

      - name: bake github repos -> src/data/repos.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/e-gleba/repos?sort=stars&direction=desc&per_page=30" \
            | jq '[.[] | select(.fork | not)]
                  | sort_by(.stargazers_count + .forks_count * 2) | reverse | .[0:6]
                  | map({id, name, description, language, stargazers_count, forks_count, html_url, updated_at, archived, fork})' \
            > src/data/repos.json.tmp || true
          # keep the committed fallback when the api is unavailable
          if [ -s src/data/repos.json.tmp ]; then mv src/data/repos.json.tmp src/data/repos.json; fi
          echo "repos baked: $(jq length src/data/repos.json)"

      - name: build static site
        run: npm run build

      - name: setup pages
        uses: actions/configure-pages@v6

      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v5
